name: Cloud AI Trainer (Free Resources)

on:
  schedule:
    # Runs automatically every 6 hours
    - cron: '0 */6 * * *'
  workflow_dispatch:
    # Manual trigger
    inputs:
      steps:
        description: 'Number of steps per training round'
        required: true
        default: '1500'

jobs:
  train-model:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 🐍 Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 🔧 Setup Git Identity (round commits need this)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: 📦 Install Dependencies
        run: pip install -r requirements.txt

      - name: 🚀 Run AI Continuous Training
        run: |
          STEPS=${{ github.event.inputs.steps || '1500' }}
          echo "Starting training for $STEPS steps per round on GitHub Cloud Runner (2 Cores, 7GB RAM)..."
          # Use smaller round-steps to complete within 6-hour GitHub limit
          # continuous.py will auto-commit & push after each round
          python isbd/continuous.py --round-steps $STEPS --batch 32 --accum-steps 2 --model small --max-restarts 3

      - name: 💾 Final Commit & Push Trained Checkpoints
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          # samples/ is gitignored — git add samples/ would exit 1 and kill the
          # whole sync step (it silently dropped a full 6-hour run before).
          git add checkpoints/best.pt checkpoints/cloud_state.pt checkpoints/history.json data/real_pairs.npz data/real_pairs_log.json || true
          git add checkpoints/ data/ || true
          git commit -m "🤖 cloud: Cloud AI Trainer completed ${{ github.event.inputs.steps || '1500' }} steps/round [skip ci]" || echo "No changes to commit"
          git push origin main || echo "push failed (non-fatal)"
