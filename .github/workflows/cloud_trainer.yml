name: Cloud AI Trainer (Free Resources)

on:
  schedule:
    # Runs automatically every 6 hours
    - cron: '0 */6 * * *'
  workflow_dispatch:
    # Manual trigger
    inputs:
      steps:
        description: 'Number of steps to train'
        required: true
        default: '3000'

jobs:
  train-model:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 🐍 Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 Install Dependencies
        run: pip install -r requirements.txt

      - name: 🚀 Run AI Continuous Training
        run: |
          STEPS=${{ github.event.inputs.steps || '3000' }}
          echo "Starting training for $STEPS steps on GitHub Cloud Runner (2 Cores, 7GB RAM)..."
          python isbd/continuous.py --round-steps $STEPS --batch 32 --accum-steps 2 --model small

      - name: 💾 Commit & Push Trained Checkpoints
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add checkpoints/ data/ samples/
          git commit -m "🤖 cloud: Cloud AI Trainer completed $STEPS steps [skip ci]" || echo "No changes to commit"
          git push origin main
